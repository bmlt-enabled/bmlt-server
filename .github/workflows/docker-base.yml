name: BMLT Docker Builds

on:
  schedule:
    - cron:  '0 12 * * 0'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.builds.outputs.matrix }}
      targets: ${{ steps.targets.outputs.matrix }}
      created: ${{ steps.timestamp.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # One entry per target/platform pair, straight out of the bake file.
      - name: Build matrix
        id: builds
        uses: docker/bake-action/subaction/matrix@v7
        with:
          files: ./docker/docker-bake.hcl
          target: ci
          fields: platforms

      - name: Target matrix
        id: targets
        uses: docker/bake-action/subaction/matrix@v7
        with:
          files: ./docker/docker-bake.hcl
          target: ci

      - name: Set build timestamp
        id: timestamp
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # One job per (image, architecture) on a native runner — no QEMU. Each pushes
  # by digest only; the merge job below turns the digests into tagged manifests.
  build:
    needs: prepare
    runs-on: ${{ startsWith(matrix.platforms, 'linux/arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.target }} (${{ matrix.platforms }})
        id: bake
        uses: docker/bake-action@v7
        with:
          files: ./docker/docker-bake.hcl
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}
        env:
          DIGEST_ONLY: '1'
          SHA: ${{ github.sha }}
          CREATED: ${{ needs.prepare.outputs.created }}

      - name: Export digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.target }}
        run: |
          digest="$(jq -er --arg t "$TARGET" '.[$t]["containerimage.digest"]' <<< "$METADATA")"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}-${{ startsWith(matrix.platforms, 'linux/arm64') && 'arm64' || 'amd64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine each target's per-arch digests into one multi-arch manifest list,
  # tagged with whatever the bake file says that target's tags are.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          digests=(*)
          [ ${#digests[@]} -gt 0 ] || { echo "no digests for $TARGET"; exit 1; }

          mapfile -t tags < <(docker buildx bake -f "$GITHUB_WORKSPACE/docker/docker-bake.hcl" "$TARGET" --print \
            | jq -er --arg t "$TARGET" '.target[$t].tags[]')
          [ ${#tags[@]} -gt 0 ] || { echo "no tags for $TARGET"; exit 1; }

          repo="${tags[0]%%:*}"
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          for digest in "${digests[@]}"; do args+=("${repo}@sha256:${digest}"); done

          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
